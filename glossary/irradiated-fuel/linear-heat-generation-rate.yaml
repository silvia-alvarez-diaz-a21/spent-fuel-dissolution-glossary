# 2. Scientific Content
definition: "Linear Heat Generation Rate (LHGR) is the thermal power generated per unit length of a nuclear fuel rod, typically expressed in watts per metre (W/m)."

description: |
  LHGR quantifies the rate at which thermal energy is generated along
  the length of a nuclear fuel rod. It is calculated as the thermal
  power produced by the fuel rod divided by its corresponding active
  length.

  LHGR is an important fuel performance parameter because it directly
  influences the temperature distribution within the fuel pellet and
  the thermal conditions experienced by the fuel and cladding. Higher
  LHGR generally results in higher fuel temperatures, depending on
  operating conditions and heat transfer characteristics.

  LHGR is also relevant to fuel burnup and the assessment of radionuclide
  inventories and release fractions. However, it is not a direct measure
  of burnup, since burnup represents the cumulative energy generated per
  unit mass of fuel, whereas LHGR describes the instantaneous power
  generated per unit length.

notes:
  - "Typical LHGR values in light-water reactors can be in the range of approximately 15-25 kW/m, depending on reactor design and operating conditions."
  - "LHGR is an important parameter in assessing fuel temperature, thermal margins and fuel performance."
  - "Fuel temperatures associated with a given LHGR depend on fuel thermal conductivity, burnup, gap conductance, cladding properties and operating conditions."
  - "LHGR is commonly used in fuel performance codes and reactor safety analyses."

pitfalls:
  - "LHGR is not equivalent to burnup: LHGR describes instantaneous linear power, whereas burnup represents cumulative energy production per unit mass of fuel."
  - "A specific LHGR value does not correspond to a unique fuel temperature; temperature also depends on thermal properties and operating conditions."

