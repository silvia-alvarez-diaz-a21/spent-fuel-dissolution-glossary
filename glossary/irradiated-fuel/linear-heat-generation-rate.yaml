# 1. Basic Information
id: linear-heat-generation-rate
term: Linear heat generation rate
abbreviation: LHGR
category: irradiated-fuel
tags: [irradiation, power, temperature]
status: draft

# 2. Scientific Content
definition: >-
  The power produced by a fuel rod per unit length.

description: >-
  The LHGR is correlated with the fuel temperature and with the burnup, so information on
  inventory or release fractions can be correlated with it. Spent LWR fuels commonly had a linear
  power of 15-25 kW/m, meaning about 800 to 1200 °C in the fuel.

notes:
  - >-
    Often noted as heat flux or q; the units give the best definition.
pitfalls: []

