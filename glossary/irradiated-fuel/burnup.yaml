# 2. Scientific Content
definition: >-
  The fission energy produced per unit mass of fuel, most often expressed in MWd/kgU.

description: >-
  Burnup describes how extensive the fuel irradiation has been and, as a consequence, it is an
  indirect characterisation of the spent fuel composition, which is known not to be uniform across
  the fuel pellet.

