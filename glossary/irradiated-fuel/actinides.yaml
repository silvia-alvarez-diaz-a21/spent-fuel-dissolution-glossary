# 2. Scientific Content
definition: >-
  Elements with atomic number 89 to 103.

description: |
  In spent nuclear fuel dissolution, specific interest is given to U, Np, Pu, Am and Cm. Actinides
  are present in the fuel as products of neutron absorption or of decay chains.

  Actinide solubility refers to their ability to pass into a solution, mostly aqueous. The amount
  of actinides in solution gives information on the oxidative dissolution of the uranium matrix.

