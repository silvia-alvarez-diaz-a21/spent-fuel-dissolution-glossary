# 1. Basic Information
id: lanthanides
term: Lanthanides
abbreviation: Ln
category: irradiated-fuel
tags: [fission-products, lanthanides, doping]
status: draft

# 2. Scientific Content
definition: >-
  The group of elements with atomic number 57 to 71, which predominate as trivalent cations.

description: >-
  As Ln ions tend to form oxides, they interact with UO2 and alter its chemical and physical
  properties. Ln-doped UO2 is used as a model material.

notes: []
pitfalls:
  - >-
    Lanthanides (the elements) are not lanthanites, which are a group of isostructural rare
    earth element carbonate minerals.

