# 1. Basic Information
id: fission-gas-release
term: Fission gas release
abbreviation: FGR
category: irradiated-fuel
tags: [fission-gas, release, post-irradiation-examination]
status: draft

# 2. Scientific Content
definition: >-
  The amount of fission gases that have escaped to the gap and plenum of a fuel rod, measured
  during post-irradiation examinations by puncturing the fuel cladding and measuring the amount of
  gas released.

description: >-
  FGR is an important parameter in the research on radionuclide release from spent fuel. The
  fission gases (Xe, Kr) released to the gap between the fuel pellet and the cladding and to the
  plenum can be used to estimate the instant release fraction of radionuclides that are mobile at
  reactor operating temperatures, such as I-129 and the Cs isotopes.

