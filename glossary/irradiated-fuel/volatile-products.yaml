# 1. Basic Information
id: volatile-products
term: Volatile products
abbreviation: ""
category: irradiated-fuel
tags: [fission-products, release, gap]
status: draft

# 2. Scientific Content
definition: >-
  Fission products (Kr, Xe, Br, I) with high intrinsic mobility, which migrate out of the fuel
  matrix and accumulate in gaps, cracks and the plenum.

notes:
  - >-
    Some are naturally volatile (e.g. Xe and I); others become volatile at high temperatures
    (Cs).
