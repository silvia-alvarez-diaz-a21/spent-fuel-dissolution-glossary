# 2. Scientific Content
definition: >-
  A system of engineered and natural barriers that work together to contain and
  isolate radioactive waste from people and the environment over the long term.

description: >-
  In deep geological disposal, the multiple-barrier system provides several
  complementary levels of protection. It consists of five main barriers:
  the nuclear fuel pellet, the fuel element and fuel bundle, the used nuclear
  fuel container, the bentonite clay buffer and backfill, and the surrounding
  geosphere. Each barrier contributes to the containment and isolation of
  radionuclides, reducing the consequences of deterioration or failure of
  individual barriers.

