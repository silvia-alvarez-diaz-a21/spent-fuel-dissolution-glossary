# 2. Scientific Content
definition: >-
  A quantitative evaluation of the long-term safety and effectiveness of a
  geological repository in containing and isolating radioactive waste.

description: >-
  Performance assessment evaluates the expected behaviour of the repository
  system over the long term, taking into account identified uncertainties.
  It considers radionuclide release rates, transport mechanisms, radiological
  doses, and the performance of engineered barriers and geological formations.
  The analysis of radionuclide flow and transport through the engineered barrier
  system and the geosphere is central to the assessment. Its purpose is to provide
  reasonable assurance that the repository will meet applicable safety standards.

