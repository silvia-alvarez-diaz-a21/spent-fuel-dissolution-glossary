# 1. Basic Information
id: deep-geological-repository
term: Deep geological repository
abbreviation: DGR
category: deep-geological-repository
tags: [repository, disposal, multi-barrier]
status: draft

# 2. Scientific Content
definition: >-
  An underground facility built hundreds of metres deep within stable rock or clay formations to
  isolate high-level radioactive waste.

description: >-
  Sealed waste canisters are placed in excavated tunnels and backfilled with dense clay to prevent
  leakage and movement. This design creates a multi-barrier system combining engineered containers
  with the natural host geology for long-term safety. By delaying any potential radionuclide
  migration, it ensures that the radioactive materials decay before reaching the surface.

notes:
  - >-
    A repository does not need to be geological or deep; 'repository' is the more general term.
