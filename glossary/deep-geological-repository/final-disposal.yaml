# 2. Scientific Content
definition: >-
  The final stage of radioactive waste management, involving the emplacement of
  radioactive waste in a disposal facility with no intention of retrieving it.

description: >-
  Final disposal is the last stage of the back end of the nuclear fuel cycle.
  For spent nuclear fuel that is not intended for reprocessing or recycling,
  it involves the permanent emplacement of the waste in a designated disposal
  facility. This stage is preceded by predisposal activities, which may include
  treatment, conditioning, packaging, transport and storage. However, not all
  predisposal activities or management strategies necessarily lead to final disposal.
  Final disposal is required for radioactive waste regardless of the fuel cycle
  strategy, even when reprocessing reduces the volume and radiotoxicity of the waste.

