# 2. Scientific Content
definition: >-
  The system of engineered, man-made components in a radioactive waste
  repository that contributes to the containment and isolation of waste
  from the biosphere.

description: >-
  The EBS works together with the natural geological barrier to provide
  long-term safety. Depending on the disposal concept and waste type, it may
  include waste forms, waste packages, containers, canisters, buffers,
  backfills, seals and repository structures. Its design is tailored to the
  characteristics of the waste and the geological environment, while ensuring
  compatibility between the different barriers.

