# 2. Scientific Content
definition: >-
  A systematic evaluation of the long-term safety of a deep geological repository
  after closure, assessing its ability to contain and isolate radioactive waste
  and protect people and the environment.

description: >-
  Post-closure safety assessment evaluates the evolution and long-term performance
  of the disposal system over extended timescales, taking into account identified
  uncertainties and potential scenarios. It considers radionuclide release and
  transport, groundwater movement, degradation of engineered barriers and the
  geological characteristics of the host formation. The assessment demonstrates
  that the repository can meet applicable safety requirements, including those
  established in the IAEA Specific Safety Requirements SSR-5, as implemented
  through national regulatory frameworks.

