# 2. Scientific Content
definition: >-
  Water present within the pore spaces of a geological formation, whose chemical
  composition influences the geochemical conditions of a deep geological repository.

description: >-
  In geological disposal of radioactive waste, characterizing pore water is essential
  for evaluating the short- and long-term evolution of the disposal system. Its chemical
  composition affects the degradation of cementitious components, corrosion of steel
  components, and the solubility and speciation of radionuclides released from the waste.
  Obtaining representative pore water samples from clay formations can be challenging
  due to their low hydraulic conductivity and the fraction of water bound as hydration
  shells to cations associated with negatively charged clay minerals. Exposure to
  atmospheric conditions can also induce oxidation and re-equilibration, disturbing
  the pore water composition.

