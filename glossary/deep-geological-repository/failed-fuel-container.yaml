# 1. Basic Information
id: failed-fuel-container
term: Failed fuel container
abbreviation: ""
category: deep-geological-repository
tags: [damaged-fuel, container, repository]
status: draft

# 2. Scientific Content
definition: >-
  A container designed to hold damaged spent nuclear fuel, that is, fuel that has lost its
  original technical and functional design capabilities with regard to handling and confinement.

description: >-
  Fuel can be damaged by incidents during packaging, handling and transportation, or by
  degradation during storage. Examples of damage include failed cladding, failed fuel meat,
  sectioned test specimens, partially reprocessed fuel, over-heated elements, dismantled
  assemblies and assemblies with lifting fixtures removed.

notes:
  - >-
    The DisCo document uses the term for the failure of the canister or container that encases
    the spent fuel, which allows groundwater to penetrate and causes radioactive contamination.
