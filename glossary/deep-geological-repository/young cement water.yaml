# 2. Scientific Content
definition: >-
  Highly alkaline liquid present within the pores of freshly hydrated cement or
  concrete, which can also be synthetically prepared to simulate early-stage cement
  pore water in laboratory experiments.

description: >-
  When cement or other porous clay-based materials come into contact with water,
  a highly alkaline solution may develop within their pores, referred to as young
  cement water. Synthetic young cement water can also be formulated for laboratory
  experiments to investigate its interaction with materials relevant to geological
  disposal of radioactive waste, including the corrosion of glass and other waste
  forms.

