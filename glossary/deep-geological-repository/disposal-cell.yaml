# 1. Basic Information
id: disposal-cell
term: Disposal cell
abbreviation: ""
category: deep-geological-repository
tags: [repository, disposal-hole, bentonite, canister, engineered-barrier]
status: draft

# 2. Scientific Content
definition: >-
  A designated underground emplacement space, also known as a disposal hole,
  in a deep geological repository where a disposal canister containing
  radioactive waste is placed and surrounded by sealing materials, typically
  bentonite.

description: |
  Disposal cells are constructed within disposal tunnels and are designed to
  accommodate disposal canisters while providing mechanical stability and
  contributing to the isolation of radioactive waste from the surrounding
  geological environment.

  In repository designs that use bentonite as a buffer material, bentonite
  blocks or other pre-installed bentonite components are placed inside the
  disposal hole before the disposal canister is emplaced. After the canister
  is positioned, the remaining space around it is filled with additional
  bentonite. Upon hydration, the bentonite swells and helps seal the space
  around the canister, limiting groundwater flow and contributing to the
  engineered barrier system.

  A deep geological repository may consist of multiple underground galleries
  and disposal tunnels, each containing multiple disposal cells. Their
  arrangement and design depend on the repository concept and the geological
  conditions of the host formation.

notes:
  - Also referred to as a disposal hole in repository designs using vertical emplacement.
  - Bentonite is commonly used as a buffer and sealing material around the disposal canister.
  - Multiple disposal cells can be arranged along a disposal tunnel.
  - The disposal cell is distinct from the disposal tunnel, which provides access to and connects multiple emplacement locations.

pitfalls:
  - Confusing a disposal cell (or disposal hole) with a disposal tunnel.
  - Treating the disposal canister and the surrounding bentonite buffer as a single barrier; they are
    distinct components of the engineered barrier system.

