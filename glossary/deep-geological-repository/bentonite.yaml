# 2. Scientific Content
definition: >-
  A clay material composed mainly of minerals of the smectite group (calcium, sodium or aluminium
  montmorillonite) that expands significantly when hydrated.

description: |
  In engineering projects, bentonite is valued for its high porosity and strong moisture
  absorption, which makes it expand when hydrated; the expansion fills the surrounding voids and
  provides mechanical support.

  In spent nuclear fuel disposal, bentonite is placed around the underground canisters as an
  engineered barrier. When exposed to groundwater it swells and seals fractures, limiting the
  water that reaches the canisters while keeping them mechanically stable.

