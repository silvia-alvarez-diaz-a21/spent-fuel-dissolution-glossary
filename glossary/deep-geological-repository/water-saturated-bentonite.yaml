# 2. Scientific Content
definition: >-
  A state of bentonite in which its pore space is completely filled with water,
  corresponding to a degree of saturation of 100%.

description: >-
  In deep geological repositories, compacted bentonite used as buffer and backfill
  material gradually takes up water supplied by the surrounding host rock.
  This process, known as saturation, increases the water content until the
  pore space becomes fully saturated. Water uptake and the associated swelling
  behaviour contribute to the hydraulic sealing properties of the bentonite barrier.

notes: [It could also be described as saturated repository. Bentonite is a better desciription since this is the material that actually gets saturated.]
