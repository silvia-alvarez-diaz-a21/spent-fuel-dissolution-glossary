# 2. Scientific Content
definition: >-
  A formal compilation of evidence, analyses and arguments that substantiate
  the claim that a radioactive waste repository will be safe.

description: >-
  The safety case evolves throughout the development of a geological repository,
  incorporating research, experience and new information. It supports decision-making
  at different stages of repository development, including site characterisation,
  construction authorisation and licensing. As the project progresses, the safety
  case becomes more comprehensive and provides a basis for demonstrating confidence
  in the continued safety of the repository.

