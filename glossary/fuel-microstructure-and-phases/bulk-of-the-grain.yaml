# 2. Scientific Content
definition: >-
  The internal volume of a grain, excluding its grain boundaries, where atoms
  are arranged in a regular crystalline structure.

description: >-
  The bulk of a grain is the crystalline region where atoms maintain
  long-range order and a specific crystallographic orientation.

