# 2. Scientific Content
definition: >-
  The formation of a new grain boundary phase within an existing grain
  boundary phase through the development of a distinct nucleus.

description: >-
  Grain boundary phase nucleation occurs when a new phase forms within
  a parent grain boundary phase. The two phases are separated by a
  grain boundary phase junction, which is a one-dimensional interface.
  The formation of the nucleus involves an energy barrier influenced
  by the grain boundary energy and elastic interactions.

