# 1. Basic Information
id: high-burnup-structure
term: High burnup structure
abbreviation: HBS
category: fuel-microstructure-and-phases
tags: [microstructure, burnup, rim]
status: draft

# 2. Scientific Content
definition: >-
  Fine-grained structure formed at the relatively cold outer rim of high burnup fuel pellets,
  where the original fuel grains subdivide into new sub-micron grains.

description: |
  The HBS forms where the local burnup is 2-3 times higher than the average pellet burnup. The
  main features of the transformation are the subdivision of the original fuel grains into new
  sub-micron grains, the relocation of the fission gas into newly formed intergranular pores, and
  the absence of large concentrations of extended defects in the fuel matrix inside the subdivided
  grains.

  The characterisation of this structure and of its impact on thermo-physical and mechanical
  properties is a key requirement to ensure that high burnup fuel operates within the safety
  margins.

