# 1. Basic Information
id: precipitation
term: Precipitation
abbreviation: ""
category: fuel-microstructure-and-phases
tags: [precipitates, fission-products, phases]
status: draft

# 2. Scientific Content
definition: >-
  Formation of precipitates when segregated non-volatile elements exceed their solubility limits
  in the UO2 lattice.

description: >-
  The precipitates are either distinct metallic clusters (Mo, Tc, Ru, Rh, Pd, etc.) or separate
  oxide phases (Rb, Cs, Ba, Zr, etc.). They reinforce the fuel material through a process called
  precipitation hardening, much like steel rebar inside a concrete column.

notes:
  - >-
    Precipitation can be thought of as the opposite process of dissolution.
