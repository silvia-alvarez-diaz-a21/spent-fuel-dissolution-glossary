# 2. Scientific Content
definition: >-
  The quantity of radionuclides accumulated at the grain boundaries of
  irradiated nuclear fuel.

description: >-
  Grain boundary inventory refers to the radionuclides located at the
  grain boundaries of spent nuclear fuel. These radionuclides may contribute
  to the instant release fraction when the fuel comes into contact with water
  following waste container failure and saturation of the engineered barrier.

