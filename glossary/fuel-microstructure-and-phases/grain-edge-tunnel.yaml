# 2. Scientific Content
definition: >-
  An interconnected pore pathway along grain edges that allows fission gas
  to migrate towards free surfaces and escape from the fuel.

description: >-
  Grain-edge tunnels form during Stage 3 of fission gas release when gas
  bubbles along grain edges interconnect, creating continuous pathways
  that extend to the fuel surface and allow gas release.

notes: []

pitfalls:
  - >-
    A grain boundary is the flat, two-dimensional interface where two crystals
    meet, whereas a grain-edge tunnel is a one-dimensional, hollow channel
    that forms along the line where three crystals meet.

