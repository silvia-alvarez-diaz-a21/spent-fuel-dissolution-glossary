# 1. Basic Information
id: grey-phase
term: Grey phase
abbreviation: ""
category: fuel-microstructure-and-phases
tags: [phases, precipitates, fission-products, perovskite]
status: draft

# 2. Scientific Content
definition: >-
  Perovskite-structured oxide precipitates of specific fission products (e.g. BaZrO3) that form
  inside the irradiated UO2 or MOX fuel matrix at high burnup, in the grains or at the grain
  boundaries.

description: >-
  Apart from Ba and Zr, the grey phases may contain a fraction of the Sr, Cs and Mo inventory of
  the fuel, so that their structural formula is more accurately described as
  (Cs,Ba,Sr)(U,Mo,Zr)O3.

