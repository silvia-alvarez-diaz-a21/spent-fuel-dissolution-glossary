term: Grain boundary
abbreviation: ""
category: fuel-microstructure-and-phases
tags: [microstructure, grain, fission-products]
status: draft

# 2. Scientific Content
definition: >-
  The interface surrounding each grain, where one crystal of the material is separated from the
  neighbouring one.

description: >-
  Grain boundaries act as natural interface pathways and sinks where fission products, gases and
  precipitates segregate and accumulate.

