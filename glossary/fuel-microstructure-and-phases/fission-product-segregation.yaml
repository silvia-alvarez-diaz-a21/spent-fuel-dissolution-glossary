# 1. Basic Information
id: fission-product-segregation
term: Fission product segregation
abbreviation: ""
category: fuel-microstructure-and-phases
tags: [fission-products, migration, microstructure]
status: draft

# 2. Scientific Content
definition: >-
  Relocation of fission products away from their original positions in the bulk of the pellet, so
  that they separate from the primary solid solution of the fuel matrix.

description: >-
  During reactor operation, fission products in the UO2 matrix undergo transport and phase
  separation driven by thermal gradients and by mechanical degradation such as fuel cracking and
  swelling. Mobile species such as the volatile products migrate to gaps, cracks and the plenum;
  non-volatile elements that exceed their solubility limits form precipitates.

