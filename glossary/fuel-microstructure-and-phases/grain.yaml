# 2. Scientific Content
definition: >-
  A microscopic UO2 crystal of the bulk ceramic fuel, typically about 10 micrometres in size.

description: >-
  Grains form the intact fluorite lattice where the fuel exists and holds fission products in
  solid solution. Their size can vary.

