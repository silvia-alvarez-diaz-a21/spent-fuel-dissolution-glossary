# 2. Scientific Content
definition: >-
  The study of the concentrations and chemical behaviour of point defects
  in solids as a function of chemical conditions and charge neutrality.

description: >-
  Defect chemistry evaluates point-defect concentrations using defect
  reactions and mass action laws while conserving chemical species,
  lattice sites and electrical charge. It describes how chemical
  potentials and doping influence the formation and compensation
  of defects.

