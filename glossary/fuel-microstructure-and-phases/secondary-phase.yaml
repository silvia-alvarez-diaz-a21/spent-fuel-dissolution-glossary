# 1. Basic Information
id: secondary-phase
term: Secondary phase
abbreviation: ""
category: fuel-microstructure-and-phases
tags: [phases, precipitation, grain-boundary]
status: draft

# 2. Scientific Content
definition: >-
  A phase into which some radionuclides of the fuel tend to precipitate, such as metallic
  particles or grey phases.

description: >-
  The nucleation of these secondary phases in the grain boundaries increases the grain boundary
  inventory. Secondary phase is the general term; grey phase refers to specific precipitates.

notes:
  - >-
    In leaching experiments the term is also used for material that precipitates from the
    solution onto the fuel surface and can act as a physical barrier to the dissolution of UO2.
