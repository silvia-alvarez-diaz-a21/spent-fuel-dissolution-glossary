# 4. Formula and Units
# 4. Formula and Units
formula: |
          m_i,aq      c_i · V_aq
FIAP_i = ───────── = ─────────────
          m_i,SNF     m_SNF · H_i.

formula_variables:
  - {symbol: "m_i,aq",  meaning: "mass of radionuclide i measured in the aqueous leaching solution", unit: "g or mol"}
  - {symbol: "m_i,SNF", meaning: "total initial inventory mass of radionuclide i present in the solid fuel sample", unit: "g or mol"}
  - {symbol: "c_i",     meaning: "concentration of radionuclide i in the aqueous solution", unit: "g/dm³ or mol/dm³"}
  - {symbol: "V_aq",    meaning: "volume of the aqueous leaching solution", unit: "dm³"}
  - {symbol: "m_SNF",   meaning: "total mass of the spent nuclear fuel sample used in the test", unit: "g"}
  - {symbol: "H_i",     meaning: "mass fraction of inventory for radionuclide i in the fuel", unit: "g/g"}
units:
  si: "1"
  db: "%"
  other: []

