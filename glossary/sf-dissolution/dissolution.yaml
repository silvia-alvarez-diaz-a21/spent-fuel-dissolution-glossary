# 1. Basic Information
id: dissolution
term: Dissolution
abbreviation: ""
category: sf-dissolution
tags: [dissolution, radiolysis, uranium, groundwater]
status: draft

# 2. Scientific Content
definition: >-
  The process of release of radioactive products from the fuel when it comes into contact with
  water underground in a disposal facility.

description: >-
  Groundwater contacts the spent fuel. Radiation from the spent fuel causes radiolysis of the
  water, producing reactive oxidising species. These species can oxidise U(IV) in UO2 fuel to more
  soluble U(VI) species. The oxidised uranium then enters the groundwater through dissolution,
  potentially facilitating the release of radionuclides from the fuel.

