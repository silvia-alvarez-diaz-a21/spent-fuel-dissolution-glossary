# 1. Basic Information
id: redox
term: Oxidation, reduction and redox conditions
abbreviation: ""
category: sf-dissolution
tags: [redox, oxidation, reduction, chemistry]
status: draft

# 2. Scientific Content
definition: >-
  Redox (reduction-oxidation) reactions involve changes in the oxidation state of one or more
  elements: oxidation is the loss of electrons and reduction the gain of electrons.

description: >-
  In the context of spent fuel dissolution, oxidising species produced by water radiolysis are
  expected to oxidise the fuel or the steel canister. A reduction happens at the same time, since
  both processes are part of the same reaction. Redox conditions describe the environment and
  whether it favours oxidation or reduction.

notes:
  - >-
    Oxidation products of uranium caused by radiolysis can easily dissolve in water and be
    transferred.
  - >-
    Mnemonic: OIL RIG (oxidation is loss, reduction is gain of electrons).
pitfalls: []

