# 1. Basic Information
id: solubility
term: Solubility
abbreviation: ""
category: sf-dissolution
tags: [solubility, solution, chemistry]
status: draft

# 2. Scientific Content
definition: >-
  The ability of one substance to dissolve in another, forming a solution, which is a homogeneous
  mixture where the individual components are evenly distributed.

description: |
  Solubility has a limit: the maximum amount of a substance that can be dissolved in a given
  volume of solvent. A solution that has not reached this limit is unsaturated, and more solute
  can still dissolve in it.

  In the case of spent nuclear fuel, the solutes are radionuclides or oxidation products of the
  fuel, so solubility is linked to the dissolution process.

