# --- Meaning ----------------------------------------------------------------------------------------
definition: >-
  Release of the constituents of a solid, here the radionuclides and elements of spent nuclear fuel, into a
  liquid (the leachant) in contact with it; in a leaching experiment, a fuel sample is kept in a solution of
  known composition and the amounts released are measured over time.
description: |
  In spent fuel studies, leaching is how the release of radionuclides to groundwater after a canister failure
  in a deep geological repository is studied in the laboratory. Two contributions are usually distinguished:

  - a fast release of the inventory that is easily accessible to water (gap, cracks, grain boundaries), the
    instant release fraction;
  - a slow release controlled by the dissolution (oxidative or not) of the UO2 matrix, in which most
    radionuclides are embedded.

  An experiment is defined by the fuel and sample (type, burn-up, size and surface area, cladded or not), the
  leachant (composition, pH, carbonate, chloride), the atmosphere and redox conditions, the temperature, and
  how the solution is handled over time. In the SNF database this last aspect is the "Type of experiment":
  Batch (the same solution is sampled over time), Replenishment (the solution is renewed, totally or
  partially, at each sampling) or Dynamic (the solution flows continuously through the sample).

  Results are reported as concentrations or amounts in solution (Results M) and as fractions of the initial
  inventory of the sample (FIAP), usually as cumulative values versus contact time.
notes:
  - In the SNF database the leaching set-up is recorded in "Type of experiment" (Batch, Replenishment, Dynamic).
  - Results need the solution volume at each sampling and, for Replenishment experiments, the volumes renewed, to
    compute cumulative releases.
pitfalls:
  - Using leaching, dissolution and corrosion as if they were the same thing; leaching is the release to
    solution, which can result from matrix dissolution, from the release of easily accessible inventory, or both.
  - Comparing cumulative and non-cumulative release values, or results of Replenishment and Batch experiments,
    without checking how the volumes were accounted for.

