# 2. Scientific Content
definition: >-
  Release of radionuclides and other constituents from spent nuclear fuel
  into an aqueous solution through interaction with the surrounding liquid.
  Leaching is a broad process that can occur through the release of readily
  accessible inventory or through dissolution of the fuel matrix.

description: |
  In spent fuel research, leaching is studied through laboratory experiments
  in which fuel samples interact with aqueous solutions (leachants) under
  controlled conditions. The release of radionuclides is measured over time
  to investigate their behaviour and assess their potential migration into
  groundwater in a deep geological repository.

  Leaching processes can also be simulated using numerical models to predict
  radionuclide release under different chemical and environmental conditions.

notes:
  - Leaching is closely related to dissolution but does not necessarily require
    dissolution of the entire fuel matrix.
  - Experimental conditions include solution composition, temperature,
    atmosphere, redox conditions and contact time.

pitfalls:
  - Using leaching and dissolution interchangeably. Leaching describes the
    release into solution, whereas dissolution refers to the breakdown of
    the solid matrix and transfer of its constituents into solution.

