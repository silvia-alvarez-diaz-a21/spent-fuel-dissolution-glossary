# 1. Basic Information
id: instant-release-fraction
term: Instant release fraction
abbreviation: IRF
category: sf-dissolution
tags: [release, radionuclide, inventory, repository]
status: draft

# 2. Scientific Content
definition: >-
  The radionuclides that are expected to be released rapidly when water comes into contact with
  UO2 or MOX fuel following container breaching in geological repository conditions.

description: >-
  These radionuclides are located in the more accessible parts of the spent fuel structure, where
  they are loosely bound (gap, grain boundaries, cracks), and are released faster than the spent
  fuel matrix during leaching. Examples: C-14, Cl-36, Se-79, and I and Cs isotopes, whose IRF can
  be estimated from the fission gas release.

