# 2. Scientific Content
definition: >-
  A chemical synthesis method in which two or more dissolved components are
  simultaneously precipitated from a solution to obtain a solid with a
  controlled composition.

description: >-
  Coprecipitation is a synthesis method used to produce homogeneous materials
  with controlled composition and stoichiometry. It involves dissolving metal
  salts in a solution at specific molar ratios, followed by the gradual
  addition of a base to induce precipitation. The resulting powder is washed
  and dried and may subsequently be sintered to obtain the desired material.
  The process involves nucleation, growth, coarsening and aggregation.

notes:
  - Also referred to as coprecipitation synthesis or the coprecipitation method.

