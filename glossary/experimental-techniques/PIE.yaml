# 2. Scientific Content
definition: >-
  The examination and characterisation of nuclear fuel and structural materials
  after irradiation in a nuclear reactor, using destructive and non-destructive
  techniques to investigate their physical, mechanical and microstructural properties.

description: >-
  Post-irradiation examination (PIE) involves the investigation of irradiated
  nuclear fuel and structural materials to evaluate their condition and
  characterise changes resulting from reactor irradiation. It is performed
  in specialised facilities equipped to handle highly radioactive materials,
  such as shielded hot cells and radiological materials laboratories.

 

