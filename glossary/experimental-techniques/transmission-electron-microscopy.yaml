# 1. Basic Information
id: transmission-electron-microscopy
term: Transmission electron microscopy
abbreviation: TEM
category: experimental-techniques
tags: [microscopy, microstructure, characterisation]
status: draft

# 2. Scientific Content
definition: >-
  Electron microscopy technique in which a high-energy electron beam passes through an ultrathin
  specimen, allowing its internal microstructure, crystal structure, defects and local composition
  to be examined at very high spatial resolution.

