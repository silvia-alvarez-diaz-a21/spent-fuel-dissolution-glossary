# 2. Scientific Content
definition: >-
  A heavily shielded enclosure that allows the safe handling and examination
  of highly radioactive materials using specialised equipment operated remotely
  by personnel from outside the enclosure.

description: >-
  Hot cells are specialised facilities designed to protect personnel from
  ionising radiation and prevent the spread of radioactive contamination
  during the handling of radioactive materials. They incorporate radiation
  shielding, viewing windows, remote manipulators and controlled ventilation
  systems to enable operations without direct contact with the materials.

  In nuclear engineering, hot cells play an important role in post-irradiation
  examination (PIE), allowing researchers to investigate the properties,
  microstructure and behaviour of nuclear fuel after irradiation in a reactor.
  They are also used for sample preparation, radiochemical analysis and
  experiments involving spent nuclear fuel dissolution.

notes:
 

pitfalls:
  - A hot cell is not the autoclave or other equipment used for experiments; it is the shielded enclosure that houses such equipment.
