id: autoclave
term: Autoclave
abbreviation: ""
category: experimental-techniques
tags: [autoclave, leaching, experiment, vessel]
status: draft

# 2. Scientific Content
definition: >-
  A vessel resistant to pressure and to chemical attack, made of a resistant metal such as
  titanium or other alloys, used in spent fuel studies to hold the leaching solution and the
  sample in leaching and dissolution experiments.

description: >-
  Autoclaves are used in many scientific fields and their size depends on the use. In spent fuel
  studies they range from a few millilitres to a few litres. They are usually installed in hot
  cells.

