abbreviation: SPFT
category: experimental-techniques
tags: [leaching, dissolution-rate, flow-through, experiment]
status: draft

# 2. Scientific Content
definition: >-
  A continuous-flow experimental set-up in which fresh solution is passed once through a reactor
  containing a solid material, and the effluent is analysed to determine the dissolution or
  release rate of the material.

description: >-
  SPFT is used to study UO2 dissolution under controlled aqueous conditions by continuously
  flowing solution over the fuel and measuring the dissolved uranium in the outlet solution.

