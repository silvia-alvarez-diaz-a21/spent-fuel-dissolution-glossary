# 2. Scientific Content
definition: >-
  Nuclear fuel designed to provide improved performance and enhanced safety
  compared with conventional fuel during normal operation, transient
  conditions and accident scenarios.

description: >-
  Accident-tolerant fuels (ATF) are a set of new fuel technologies developed
  to improve the safety and performance of nuclear fuel in nuclear power
  plants. They aim to provide better performance during normal operation,
  transient conditions and accident scenarios.

