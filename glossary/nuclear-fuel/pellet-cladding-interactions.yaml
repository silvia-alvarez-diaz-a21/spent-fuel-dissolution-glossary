# 2. Scientific Content
definition: >-
  An interaction between nuclear fuel pellets and their surrounding cladding,
  which can lead to fuel cladding failure during changes in reactor power.

description: >-
  Pellet-cladding interaction (PCI) is a potential cause of fuel failure
  associated with changes in reactor power, control rod movement and plant
  startup. Failures typically occur within a few hours or days following a
  power ramp or control rod movement. These events can lead to restrictions
  on reactor startup ramp rates to reduce the risk of fuel failure.

notes:
  - "PCI-related failures are particularly associated with changes in reactor power."
  - "Fuel cladding acts as a barrier that prevents radioactive fission products from escaping into the reactor coolant."
  - "Cladding failure can result in the release of fission products into the primary circuit and increased radiation levels."
  - "Fuel failures can lead to premature fuel discharge, shorter subsequent operating cycles, unscheduled outages and increased spent fuel volumes."

