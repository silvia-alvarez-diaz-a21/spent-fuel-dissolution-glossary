id: cladding
term: Cladding
abbreviation: null
category: nuclear-fuel
tags:
  - nuclear-fuel
  - fuel-fabrication
  - light-water-reactors

definition: >
  The metallic material surrounding nuclear fuel pellets, forming the
  outer protective barrier of a fuel rod.

description: >
  In most power reactors, particularly Light Water Reactors (LWRs), the
  cladding consists of a thin-walled metallic tube that encloses the
  nuclear fuel pellets to form a fuel rod. It provides structural support,
  maintains the integrity of the fuel rod during reactor operation, and
  acts as a barrier to prevent the release of radioactive fission products
  and other fuel materials into the reactor coolant. Cladding materials
  are selected for their mechanical strength, corrosion resistance and
  compatibility with the reactor operating environment.

