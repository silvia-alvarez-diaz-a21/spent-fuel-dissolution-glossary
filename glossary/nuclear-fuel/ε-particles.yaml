# 2. Scientific Content
definition: "Noble-metal-rich particles formed by the segregation of noble-metal dopants, such as Pd, Ru, Rh and Mo, from the UO2 oxide matrix."

description: "These particles form because noble-metal dopants are unstable in the UO2 oxide matrix and segregate into separate particles. They are commonly referred to as ε-particles."

