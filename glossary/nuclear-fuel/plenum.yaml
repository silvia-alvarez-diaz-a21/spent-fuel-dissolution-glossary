# 2. Scientific Content
definition: >-
  An internal gas-filled space within a nuclear fuel rod, located above or
  below the fuel pellet stack.

description: >-
  The plenum is the unoccupied space inside the fuel cladding at either end
  of the fuel pellet stack. It is divided into the upper plenum, above the
  fuel pellets, and the lower plenum, below them. These spaces accommodate
  fission gases released during irradiation and allow for gas expansion.

notes:
  - "Upper plenum: the space inside the fuel rod above the fuel pellet stack."
  - "Lower plenum: the space inside the fuel rod below the fuel pellet stack."

