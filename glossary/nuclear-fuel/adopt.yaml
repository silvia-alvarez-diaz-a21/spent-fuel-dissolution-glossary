# 1. Basic Information
id: adopt
term: Advanced Doped Pellet Technology
abbreviation: ADOPT
category: nuclear-fuel
tags: [doping, nuclear-fuel, accident-tolerant-fuel]
status: draft

# 2. Scientific Content
definition: >-
  An improved UO2 fuel pellet doped with small amounts of chromia (Cr2O3) and alumina (Al2O3),
  developed by Westinghouse to improve fuel cycle economics and the accident tolerance of
  conventional UO2 fuel pellets.

description: >-
  It was developed in conjunction with Westinghouse's EnCore fuel programme. Its main
  characteristic is an enlarged grain size, which results in lower fission gas release and
  increased density.

