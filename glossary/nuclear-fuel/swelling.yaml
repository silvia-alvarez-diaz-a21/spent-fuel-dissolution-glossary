# 2. Scientific Content
definition: >-
  The increase in volume of nuclear fuel during irradiation due to the
  accumulation of fission products and the formation of solid, liquid
  and gaseous phases.

description: >-
  During irradiation, UO2 fuel gradually accumulates fission products
  within its structure. Their accumulation leads to fuel swelling and
  may also result in fission gas release.

