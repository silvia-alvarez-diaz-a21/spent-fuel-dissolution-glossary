id: pellet
term: Pellet
abbreviation: null
category: nuclear-fuel
status: draft
tags:
  - nuclear-fuel
  - fuel-fabrication
  - light-water-reactors

definition: >
  A small, cylindrical ceramic body of nuclear fuel, manufactured to
  precise dimensions and used as the fuel material inside a fuel rod.

description: >
  In most power reactors, particularly Light Water Reactors (LWRs),
  fuel pellets are commonly manufactured from uranium dioxide (UO2)
  ceramic powder, which is processed and sintered into dense cylindrical
  bodies of precise dimensions. The pellets are stacked inside metallic
  cladding tubes to form fuel rods, which are subsequently grouped into
  fuel assemblies for loading into the reactor core. During reactor
  operation, the pellets contain the fissile and fertile nuclear material
  in which fission reactions take place, generating heat for energy
  production.

