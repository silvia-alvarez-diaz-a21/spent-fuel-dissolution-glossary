# 2. Scientific Content
definition: >-
  The formation and propagation of cracks in a material due to mechanical,
  environmental, chemical or metallurgical factors.

description: >-
  Cracking in nuclear power plant materials can result from the combined
  effects of tensile stress, aggressive environments and material
  susceptibility. Corrosion, temperature, contaminants and neutron
  irradiation can contribute to crack initiation and propagation.

