term: Wet coating method
abbreviation: WCM
category: nuclear-fuel
tags: [fuel-fabrication, doping, model-materials]
status: draft

# 2. Scientific Content
definition: >-
  Wet chemical route for the preparation of doped UO2-based model ceramic pellets, used as model
  materials for modern nuclear fuels.

description: >-
  It is also described as a powder coating technique used to protect nuclear fuel additives (UN
  spheres) in accident tolerant fuel compositions.

