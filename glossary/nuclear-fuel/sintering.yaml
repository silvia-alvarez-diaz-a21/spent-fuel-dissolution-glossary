# 1. Basic Information
id: sintering
term: Sintering
abbreviation: ""
category: nuclear-fuel
tags: [fuel-fabrication, pellet, uranium-dioxide]
status: draft

# 2. Scientific Content
definition: >-
  Manufacturing process of UO2 fuel pellets in which compacted UO2 powder is heated to high
  temperature until the original particles coalesce, so that the volume of the pellet decreases
  and its density increases.

description: >-
  UO2 powder is first compacted into a highly porous pellet. This powder compact is then heated to
  high temperature until the particles coalesce, creating a dense pellet with some residual
  porosity.

notes:
  - >-
    The sintering atmosphere sets the oxygen potential, e.g. Ar/4% H2 with an oxygen potential
    of -510 kJ/mol O2.
pitfalls: []

