# 2. Scientific Content
definition: "Sintering is the thermal process by which compacted UO2 powder particles bond and coalesce at high temperatures, resulting in pellet shrinkage, reduced porosity and increased density."

description: |
  In nuclear fuel fabrication, UO2 powder is first compacted into a
  porous green pellet. The compact is subsequently heated to high
  temperatures, typically below the melting point of UO2. During
  sintering, solid-state diffusion mechanisms promote particle bonding,
  grain growth and pore elimination. These processes cause the pellet
  to shrink and increase in density, producing a mechanically stable
  fuel pellet with a controlled residual porosity.

notes:
  - "Sintering is typically performed in a controlled atmosphere."
  - "The final pellet retains some residual porosity."
  - "Sintering temperature, duration and atmosphere influence the final microstructure and density."

pitfalls:
  - "Sintering does not involve complete melting of the UO2 powder."
 

