id: mox-fuel
term: Mixed oxide fuel
abbreviation: MOX
category: nuclear-fuel
tags: [nuclear-fuel, plutonium, uranium, fuel-type]
status: draft

# 2. Scientific Content
definition: >-
  Nuclear fuel made of a mixture of uranium and plutonium oxides (UO2 + PuO2), used in certain
  types of reactors.

description: >-
  Plutonium (with uranium) recovered from spent fuel can be used to produce MOX fuel. Recovered
  uranium can be converted to UF6 and re-enriched.

