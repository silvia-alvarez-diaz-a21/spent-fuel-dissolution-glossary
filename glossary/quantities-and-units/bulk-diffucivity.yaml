# 2. Scientific Content
definition: >-
  The diffusion coefficient describing the migration of atoms or point defects
  through the interior of a crystalline material by lattice diffusion.

description: >-
  Bulk diffusivity describes the migration of atoms or point defects through
  a crystal lattice by individual jumps. It depends on temperature,
  composition gradient and pressure. In nuclear fuel, it influences
  the diffusion of fission gases.

