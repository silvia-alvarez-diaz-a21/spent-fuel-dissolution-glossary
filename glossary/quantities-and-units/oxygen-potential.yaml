# 1. Basic Information
id: oxygen-potential
term: Oxygen potential
abbreviation: ""
category: quantities-and-units
tags: [thermodynamics, oxygen, fuel-chemistry]
status: draft

# 2. Scientific Content
definition: >-
  The thermodynamic driving force for oxygen diffusion in a multicomponent system, expressed as
  the partial molar Gibbs free energy of oxygen.

description: >-
  It determines oxygen redistribution, influencing local chemical reactions, fuel decomposition
  and dissolution rates.

notes:
  - >-
    Example: a sintering atmosphere of Ar/4% H2 with an oxygen potential of -510 kJ/mol O2.
