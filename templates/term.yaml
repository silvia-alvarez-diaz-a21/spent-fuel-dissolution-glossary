# =====================================================================================================
# TERM TEMPLATE — copy this file into the right category folder under glossary/ and rename it to
# <id>.yaml (e.g. glossary/results/release-fractions/fiap.yaml). One file = one term.
#
# Required fields are marked (required). Everything else: fill it if you know it, otherwise delete the
# line or leave it empty ([] / "" / null). Do not invent values: an empty field is better than a guess.
# Check the file with:  .venv\Scripts\python -m glossary_tools validate
# The full rules are in schema/term.schema.json; a filled example is in templates/term.example.yaml.
# =====================================================================================================

# --- Identity ---------------------------------------------------------------------------------------
id: ""                      # (required) stable key used by the APIs: lowercase, digits and hyphens, equal to
                            # the file name without .yaml (e.g. "fiap"). Never change it once approved.
term: ""                    # (required) preferred label in English, as it should be displayed (e.g. "Fraction of Inventory in the Aqueous Phase")
abbreviation: ""            # acronym or short form if any (e.g. "FIAP")
symbol: ""                  # symbol used in equations, LaTeX allowed (e.g. "F_{IAP}")
category: ""                # (required) folder path under glossary/ (e.g. "results/release-fractions"); must match where the file is
tags: []                    # free keywords for search (e.g. [leaching, release, radionuclide])
status: draft               # (required) draft | review | approved | deprecated
replaced_by: ""             # only when status is deprecated: id of the term that replaces it

# --- Meaning ----------------------------------------------------------------------------------------
definition: ""              # (required) one or two sentences, self-contained, no citations inside
description: |              # longer explanation (Markdown allowed): context in spent fuel leaching experiments,
                            # how it is measured or reported, why it matters
notes: []                   # practical remarks, e.g. ["Often reported as cumulative values", "Not to be confused with ..."]
pitfalls: []                # typical mistakes when reading papers or entering data in the DB

# --- Other names --------------------------------------------------------------------------------------
synonyms: []                # other labels for the SAME concept. Each item:
#  - label: ""              #   the alternative label
#    type: exact            #   exact | abbreviation | spelling-variant | deprecated | narrower-usage | broader-usage
#    lang: en               #   ISO 639-1 language code
#    note: ""               #   optional: who uses it / when
translations: {}            # preferred label in other languages, e.g. {es: "", fr: "", de: "", sv: "", fi: "", ja: ""}

# --- Quantity (only for measurable terms; delete the block for concepts) ----------------------------------
quantity:
  kind: ""                  # numeric | categorical | text | boolean | date
  unit: ""                  # unit as stored in the DB (UCUM-style text, e.g. "mol/L", "GWd/tHM", "degC", "%")
  si_unit: ""               # equivalent SI unit if different
  other_units: []           # units found in the literature. Each item:
#   - unit: ""              #   e.g. "MWd/kgU"
#     to_db_unit: ""        #   conversion to the DB unit, e.g. "x * 1" or "x / 1000"
  allowed_values: []        # for categorical terms: the controlled values. Each item:
#   - value: ""             #   stored value, e.g. "oxidizing"
#     definition: ""        #   what it means
  typical_range:            # usual values in spent fuel leaching experiments (with the reference that supports it)
    min: null
    max: null
    context: ""             # e.g. "UO2 fuel, static leaching in bicarbonate water"
    reference: ""           # id of an item in references below
  formula: ""               # LaTeX, e.g. "F_{IAP} = \\frac{m_{i,aq}}{m_{i,inventory}}"
  formula_variables: []     # each item: {symbol: "", meaning: "", unit: ""}

# --- Relations to other terms (use their id) -------------------------------------------------------------
broader: []                 # more general terms (e.g. "release-fraction")
narrower: []                # more specific terms
related: []                 # associated terms. Each item:
#  - id: ""                 #   id of the other term
#    relation: related      #   related | depends-on | measured-by | input-of | result-of | opposite-of | see-also

# --- Link to the SNF database (snf-db-app, backend/schema_v2.json) ------------------------------------------
db_mapping: []              # where this term lives in the DB. Each item:
#  - table: ""              #   reference_v2 | experiment_v2 | nuclear_fuel_data_v2 | results_fiap_v2 |
#                           #   results_m_v2 | initial_inventory_v2 | initial_inventory_uncertainty_v2
#    field: ""              #   column name, e.g. "bu_average"
#    excel_header: ""       #   header in the Excel template / HEADER_MAP, e.g. "Burn Up (GWd/tHM)"
#    note: ""               #   e.g. "stored as text, range written as min-max"

# --- Sources -----------------------------------------------------------------------------------------
references: []              # every claim above should be backed here. Each item:
#  - id: ""                 #   short key used inside this file, e.g. "ref1" or "2004POI/SER"
#    type: article          #   article | report | book | standard | thesis | website | database | other
#    citation: ""           #   full citation as in the DB full_reference style
#    doi: ""                #   10.xxxx/... without https://doi.org/
#    url: ""
#    pages: ""              #   pages, table or figure, e.g. "p. 12, Table 3"
#    quote: ""              #   short literal sentence supporting the definition (optional)
#    supports: []           #   which fields it supports, e.g. [definition, typical_range]
standards: []               # norms or official glossaries, e.g. ["IAEA Nuclear Safety and Security Glossary (2022)", "ASTM C1308"]
external_ids: {}            # ids in other vocabularies, e.g. {wikidata: "Q...", iupac_gold_book: "", iaea_glossary: "", inis_thesaurus: ""}

# --- Examples -------------------------------------------------------------------------------------------
examples: []                # short real usages. Each item:
#  - text: ""               #   e.g. "FIAP of Cs-137 after 30 days: 1.2 %"
#    reference: ""          #   id of an item in references

# --- Bookkeeping ------------------------------------------------------------------------------------
authors: []                 # (required) who wrote it, e.g. ["Name Surname"]
reviewers: []               # who approved it (needed for status: approved)
created: ""                 # (required) YYYY-MM-DD
updated: ""                 # (required) YYYY-MM-DD, change it on every edit
history: []                 # each item: {date: "YYYY-MM-DD", author: "", change: ""}
