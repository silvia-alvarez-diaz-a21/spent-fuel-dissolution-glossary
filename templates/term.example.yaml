# 1. Basic Information
id: fiap
term: Fraction of Inventory in the Aqueous Phase
abbreviation: FIAP
category: sf-dissolution
tags: [leaching, release, radionuclide, inventory]

# 2. Scientific Content
definition: >-
  Ratio of the amount of a radionuclide or element measured in the leaching
  solution to its initial amount in the spent fuel sample.

description: |
  FIAP normalises the measured release by the initial inventory, allowing
  comparisons between radionuclides, samples and experiments.

  It is commonly reported as a cumulative value over the experiment duration.
  Its calculation requires the initial sample inventory, solution concentration
  and corresponding solution volume.

notes:
  - Usually reported as a cumulative value versus contact time.
  - Expressed as a fraction (0–1) or a percentage (0–100%).

pitfalls:
  - Confusing fractions with percentages.
  - Using the fuel rod inventory instead of the actual leached sample inventory.
  - Comparing results without considering experimental conditions and sampling times.

