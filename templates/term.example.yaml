id: fiap
term: Fraction of Inventory in the Aqueous Phase
abbreviation: FIAP
symbol: "F_{IAP,i}"
category: sf-dissolution
tags: [leaching, release, radionuclide, inventory]
status: draft
replaced_by: ""

definition: >-
  Amount of a given radionuclide or element measured in the leaching solution divided by the amount of that
  radionuclide or element initially present in the spent fuel sample.
description: |
  The FIAP normalises the measured release by the initial inventory of the sample, so that releases of
  different nuclides, samples and experiments can be compared. In leaching experiments it is usually
  reported per sampling time, as a cumulative value over the experiment duration.

  It needs the initial inventory of the sample (from burn-up calculations or measurements) and the
  concentration measured in solution together with the solution volume.
notes:
  - Usually reported as cumulative values versus contact time.
  - Can be given as a fraction (0-1) or as a percentage; the DB unit says which.
pitfalls:
  - Mixing fractions and percentages when entering data.
  - Using the inventory of the whole rod instead of the inventory of the leached sample.

